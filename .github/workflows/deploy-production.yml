name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm production deployment'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Confirm deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo "Deployment not confirmed. Aborting."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY_DATA: ${{ secrets.PRODUCTION_SSH_KEY }}
          EC2_IP: ${{ vars.PRODUCTION_EC2_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_DATA" > ~/.ssh/cars-list-production
          chmod 600 ~/.ssh/cars-list-production
          ssh-keyscan -H "$EC2_IP" >> ~/.ssh/known_hosts

      - name: Create .env file
        env:
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          API_KEY: ${{ secrets.PROD_API_KEY }}
          S3_BUCKET: ${{ vars.PROD_S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cat > .env.remote <<ENVEOF
          NODE_ENV=production
          PORT=3000
          PG_HOST=db
          PG_PORT=5432
          PG_USER=postgres
          PG_PASSWORD=${DB_PASSWORD}
          PG_DATABASE=cars
          API_KEY=${API_KEY}
          S3_BUCKET=${S3_BUCKET}
          S3_ENDPOINT=
          S3_PUBLIC_ENDPOINT=
          AWS_REGION=${AWS_REGION}
          ENVEOF

      - name: Deploy to production
        env:
          EC2_IP: ${{ vars.PRODUCTION_EC2_IP }}
        run: |
          SSH_KEY="$HOME/.ssh/cars-list-production"

          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no ec2-user@"$EC2_IP" "mkdir -p ~/cars-list/{scripts,src}"

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no \
            docker-compose.yml Dockerfile package.json package-lock.json tsconfig.json \
            ec2-user@"$EC2_IP":~/cars-list/

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -r scripts/ \
            ec2-user@"$EC2_IP":~/cars-list/

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -r src/ \
            ec2-user@"$EC2_IP":~/cars-list/

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no .env.remote \
            ec2-user@"$EC2_IP":~/cars-list/.env

          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no ec2-user@"$EC2_IP" << 'REMOTE'
          cd ~/cars-list
          if docker compose build app && docker compose up -d --remove-orphans; then
            if docker compose --profile tools run --rm migrate; then
              echo "Migrations completed successfully."
            else
              echo "ERROR: Migrations failed!" >&2
              exit 1
            fi
          else
            echo "ERROR: Build or deploy failed!" >&2
            exit 1
          fi
          REMOTE

          rm -f .env.remote

      - name: Smoke test production
        env:
          EC2_IP: ${{ vars.PRODUCTION_EC2_IP }}
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 5
            STATUS=$(curl -sf --max-time 5 http://"$EC2_IP":3000/health | jq -r .status 2>/dev/null) && break
          done
          if [ "$STATUS" != "ok" ]; then
            echo "Production health check failed!"
            exit 1
          fi
          echo "Production is healthy."
